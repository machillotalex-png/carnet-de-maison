  if (!state.enfants) state.enfants = [];
  if (!state.coursesHistorique) state.coursesHistorique = [];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function isoDate(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO() { return isoDate(new Date()); }
  function newId() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function addCourseItem(texte, categorie, assignee) {
    texte = texte.trim();
    if (!texte) return;
    var lower = texte.toLowerCase();
    var alreadyActive = state.courses.some(function (c) { return !c.achete && c.texte.toLowerCase() === lower; });
    if (!alreadyActive) {
      state.courses.push({ id: newId(), texte: texte, categorie: categorie || "Autre", achete: false, assignee: assignee || "" });
    }
    var hist = state.coursesHistorique.filter(function (h) { return h.texte.toLowerCase() === lower; })[0];
    if (hist) { hist.count += 1; hist.categorie = categorie || hist.categorie; }
    else state.coursesHistorique.push({ texte: texte, categorie: categorie || "Autre", count: 1 });
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function mondayOf(date) {
    var d = new Date(date);
    var day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function formatHuman(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  }
  function formatShort(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }
  function buildMonthGrid(monthDate) {
    var first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
    var last = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
    var gridStart = mondayOf(first);
    var gridEnd = mondayOf(last);
    gridEnd.setDate(gridEnd.getDate() + 6);
    var days = [];
    var cur = new Date(gridStart);
    while (cur <= gridEnd) { days.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
    return days;
  }

  // ---------- Rendering ----------

  function renderTodayStrip() {
    var t = todayISO();
    var rdvToday = state.rdvs.filter(function (r) { return r.date === t; }).length;
    var repasT = state.repas[t] || {};
    var repasCount = (repasT.midi ? 1 : 0) + (repasT.soir ? 1 : 0);
    var aAcheter = state.courses.filter(function (c) { return !c.achete; }).length;
    var tachesRestantes = state.taches.filter(function (x) { return !x.fait; }).length;
    return (
      '<div class="today-strip">' +
      '<span class="pill"><strong>' + rdvToday + '</strong> rendez-vous aujourd\u2019hui</span>' +
      '<span class="pill"><strong>' + repasCount + '/2</strong> repas prévus aujourd\u2019hui</span>' +
      '<span class="pill"><strong>' + aAcheter + '</strong> article' + (aAcheter > 1 ? "s" : "") + ' à acheter</span>' +
      '<span class="pill"><strong>' + tachesRestantes + '</strong> tâche' + (tachesRestantes > 1 ? "s" : "") + ' en attente</span>' +
      '</div>'
    );
  }

  function renderCalendar() {
    var base = new Date();
    base = new Date(base.getFullYear(), base.getMonth() + ui.calMonthOffset, 1);
    var monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    var grid = buildMonthGrid(base);
    var t = todayISO();
    var rdvByDate = {};
    state.rdvs.forEach(function (r) { rdvByDate[r.date] = (rdvByDate[r.date] || 0) + 1; });
    var dowRow = DAYS.map(function (d) { return '<div class="cal-dow">' + d.slice(0, 3) + "</div>"; }).join("");
    var cells = grid.map(function (d) {
      var iso = isoDate(d);
      var outside = d.getMonth() !== base.getMonth();
      var cls = ["cal-day"];
      if (outside) cls.push("cal-outside");
      if (iso === t) cls.push("cal-today");
      if (iso === ui.selectedDate) cls.push("cal-selected");
      if (rdvByDate[iso]) cls.push("has-rdv");
      return '<div class="' + cls.join(" ") + '" data-action="cal-select" data-date="' + iso + '">' + d.getDate() + "</div>";
    }).join("");
    return (

      '<button data-action="cal-prev" aria-label="Mois précédent">‹</button>' +
      '<span class="label">' + monthLabel + "</span>" +
      '<button data-action="cal-next" aria-label="Mois suivant">›</button>' +
      "</div>" +
      '<div class="cal-grid">' + dowRow + cells + "</div>"
    );
  }

  function renderSemaine() {
    var t = todayISO();
    var end = new Date(); end.setDate(end.getDate() + 6);
    var endISO = isoDate(end);

    var rdvsAvenir = state.rdvs
      .filter(function (r) { return r.date >= t && r.date <= endISO; })
      .sort(function (a, b) { return (a.date + (a.heure || "")) < (b.date + (b.heure || "")) ? -1 : 1; });
    var rdvHtml = rdvsAvenir.length
      ? '<ul class="item-list">' + rdvsAvenir.map(function (r) {
          return (
            '<li><div class="item-main"><div class="item-title">' + escapeHtml(r.titre) + "</div>" +
            '<div class="item-meta">' + formatShort(r.date) + (r.heure ? " · " + r.heure : "") + (r.lieu ? " · " + escapeHtml(r.lieu) : "") + "</div></div></li>"
          );
        }).join("") + "</ul>"
      : '<div class="empty-state">Rien de prévu cette semaine.</div>';

    var repasHtml = "";
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() + i);
      var iso = isoDate(d);
      var entry = state.repas[iso] || {};
      if (!entry.midi && !entry.soir) continue;
      repasHtml +=
        '<div class="semaine-repas-row"><strong>' + (i === 0 ? "Aujourd'hui" : DAYS[(d.getDay() + 6) % 7]) + '</strong>' +
        (entry.midi ? '<span>Midi : ' + escapeHtml(entry.midi) + "</span>" : "") +
        (entry.soir ? '<span>Soir : ' + escapeHtml(entry.soir) + "</span>" : "") +
        "</div>";
    }
    if (!repasHtml) repasHtml = '<div class="empty-state">Aucun repas prévu pour l\u2019instant.</div>';

    var tachesOuvertes = state.taches.filter(function (x) { return !x.fait; });
    var tachesHtml = tachesOuvertes.length
      ? '<ul class="item-list">' + tachesOuvertes.map(function (x) {
          return (

      : '<div class="empty-state">Aucune tâche en attente.</div>';

    var aAcheter = state.courses.filter(function (c) { return !c.achete; });
    var coursesHtml = aAcheter.length
      ? '<ul class="item-list">' + aAcheter.slice(0, 8).map(function (c) {

        }).join("") + "</ul>" + (aAcheter.length > 8 ? '<div class="empty-state">+ ' + (aAcheter.length - 8) + " autre(s), voir l'onglet Courses.</div>" : "")

    return (
      '<h2 class="section-title">Cette semaine</h2>' +
      '<div class="group-label">Rendez-vous</div>' + rdvHtml +
      '<div class="group-label">Repas</div>' + repasHtml +
      '<div class="group-label">Tâches</div>' + tachesHtml +
      '<div class="group-label">Courses à faire</div>' + coursesHtml

  function renderRecherche() {

  function resizeImageFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var maxDim = 240;
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function ageLabel(dob) {
    if (!dob) return "";
    var b = new Date(dob + "T00:00:00");
    var now = new Date();
    var months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
    if (now.getDate() < b.getDate()) months -= 1;
    if (months < 0) return "";
    if (months < 24) return months + " mois";
    return Math.floor(months / 12) + " ans";
  }

    var enfantById = {};
    state.enfants.forEach(function (e) { enfantById[e.id] = e.prenom; });

  function renderCourses() {
    var groups = {};
    CATEGORIES.forEach(function (c) { groups[c] = []; });
    state.courses.forEach(function (c) {
      if (!groups[c.categorie]) groups[c.categorie] = [];
      groups[c.categorie].push(c);
    });

    var hasAny = state.courses.length > 0;
    var body = "";
    if (!hasAny) {
      body = '<div class="empty-state">Liste vide. Ajoutez votre premier article ci-dessus.</div>';
    } else {
      CATEGORIES.forEach(function (cat) {
        var list = groups[cat] || [];
        if (!list.length) return;
        list.sort(function (a, b) { return (a.achete === b.achete) ? 0 : a.achete ? 1 : -1; });
        body +=
          '<div class="group-label">' + escapeHtml(cat) + "</div>" +
          '<ul class="item-list">' +
          list.map(function (c) {

              '<li class="' + (c.achete ? "item-done" : "") + '">' +

              '<div class="item-main"><div class="item-title">' + escapeHtml(c.texte) + (c.assignee ? ' <span class="assignee-badge">' + escapeHtml(c.assignee) + "</span>" : "") + "</div></div>" +

              "</li>"

          }).join("") +

    var hasChecked = state.courses.some(function (c) { return c.achete; });

    var activeLower = {};
    state.courses.forEach(function (c) { if (!c.achete) activeLower[c.texte.toLowerCase()] = true; });
    var suggestions = state.coursesHistorique
      .filter(function (h) { return !activeLower[h.texte.toLowerCase()]; })
      .sort(function (a, b) { return b.count - a.count; })
      .slice(0, 6);
    var chips = suggestions.length
      ? '<div class="chip-row">' + suggestions.map(function (h) {

    return (
      '<h2 class="section-title">Liste de courses</h2>' +
      '<form class="add-form" data-action="add-course">' +
      '<input type="text" name="texte" placeholder="Article à ajouter" required>' +
      '<select name="categorie">' +
      CATEGORIES.map(function (c) { return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>"; }).join("") +
      "</select>" +
      '<select name="assignee"><option value="">Qui ?</option>' +
      ASSIGNEES.map(function (a) { return '<option value="' + a + '">' + a + "</option>"; }).join("") +
      "</select>" +
      '<button type="submit" class="btn-add">Ajouter</button>' +

    );

      '<select name="assignee"><option value="">Qui ?</option>' +

  function renderBodyContent(s) {

  // ---------- Persistence ----------

  var artifactApi = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) { artifactApi = a; }).catch(function () {});
  }

  function buildDocument(s) {
    var stateScript = '<script id="state-data" type="application/json">' + JSON.stringify(s) + '<' + "/script>";
    return (
      "<!DOCTYPE html>\n<html lang=\"fr\" data-theme=\"light\">\n" +

  function exportData() {
    var json = JSON.stringify(state, null, 2);
    var filename = "carnet-maison-" + todayISO() + ".json";
    function fallbackDownload() {
      try {
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      } catch (e) {}
    }
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (dl) {
        if (!dl) { fallbackDownload(); return; }
        dl.save({ filename: filename, data: json }).catch(fallbackDownload);
      }).catch(fallbackDownload);
    } else {
      fallbackDownload();
    }
  }

  function persist() {
    try { localStorage.setItem("carnet-maison-state", JSON.stringify(state)); } catch (e) {}
    if (artifactApi) {
      artifactApi.publish(buildDocument(state)).catch(function () {});
    }
    scheduleDriveSave();
  }

  (function loadLocalFallbackIfEmpty() {
    var empty = !state.rdvs.length && !state.courses.length && !state.taches.length && !state.notes.length && !state.depenses.length && !state.enfants.length && Object.keys(state.repas).length === 0;
    if (!empty) return;
    try {
      var saved = localStorage.getItem("carnet-maison-state");
      if (saved) state = JSON.parse(saved);
    } catch (e) {}
  })();

  // ---------- Google Sign-In + Google Drive sync ----------
  // Nécessite d'avoir renseigné GOOGLE_CLIENT_ID / GOOGLE_API_KEY ci-dessus,
  // et de tourner sur un domaine autorisé (ne fonctionne pas depuis le lien claude.ai,
  // bloqué volontairement par la politique de sécurité des pages publiées).

  function loadScriptOnce(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.async = true;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("blocked: " + src)); };
      document.head.appendChild(s);
    });
  }

  function driveHeaders() {
    return { Authorization: "Bearer " + google_.accessToken };
  }

  function driveFetch(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, driveHeaders());
    return fetch(url, opts).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error("Drive API " + r.status + ": " + t); });
      return r;
    });
  }

  function loadFromDrive(fileId, silent) {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media")
      .then(function (r) { return r.json(); })
      .then(function (remote) {
        var same = JSON.stringify(remote) === JSON.stringify(state);
        if (!same) {
          state = remote;
          if (!state.rdvs) state.rdvs = [];
          if (!state.repas) state.repas = {};
          if (!state.courses) state.courses = [];
          if (!state.taches) state.taches = [];
          if (!state.notes) state.notes = [];
          if (!state.depenses) state.depenses = [];
          if (!state.enfants) state.enfants = [];
          if (!state.coursesHistorique) state.coursesHistorique = [];
          try { localStorage.setItem("carnet-maison-state", JSON.stringify(state)); } catch (e) {}
          render();
        }
        ui.driveStatus = "Synchronisé avec Google Drive";
        if (!silent) render();
      })
      .catch(function () {
        ui.driveStatus = "Impossible de récupérer les dernières données";
        if (!silent) render();
      });
  }

  var driveSaveTimer = null;
  function scheduleDriveSave() {
    if (!ui.driveFileId || !google_.accessToken) return;
    if (driveSaveTimer) clearTimeout(driveSaveTimer);
    driveSaveTimer = setTimeout(function () {
      driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + ui.driveFileId + "?uploadType=media", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state)
      }).catch(function () {});
    }, 1200);
  }

  function createDriveFile() {
    var boundary = "carnet_maison_boundary";
    var metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
    var body =
      "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) + "\r\n" +
      "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify(state) + "\r\n" +
      "--" + boundary + "--";
    return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { "Content-Type": 'multipart/related; boundary="' + boundary + '"' },
      body: body
    })
      .then(function (r) { return r.json(); })
      .then(function (file) {
        ui.driveFileId = file.id;
        try { localStorage.setItem("carnet-maison-drive-file-id", file.id); } catch (e) {}
        ui.driveStatus = "Carnet créé — pense à le partager avec Laura";
        render();
      });
  }

  function openSharePage() {
    if (!ui.driveFileId) return;
    window.open("https://drive.google.com/file/d/" + ui.driveFileId + "/view", "_blank");
  }

  function createCalendarEvent(rdv) {
    if (!google_.accessToken) return Promise.resolve(null);
    var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Europe/Paris";
    var body;
    if (rdv.heure) {
      var start = new Date(rdv.date + "T" + rdv.heure + ":00");
      var end = new Date(start.getTime());
      end.setHours(end.getHours() + 1);
      function toLocalDT(d) { return isoDate(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00"; }
      body = {
        summary: rdv.titre,
        location: rdv.lieu || "",
        start: { dateTime: toLocalDT(start), timeZone: tz },
        end: { dateTime: toLocalDT(end), timeZone: tz },
        reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 60 }] }
      };
    } else {
      var endDate = new Date(rdv.date + "T00:00:00");
      endDate.setDate(endDate.getDate() + 1);
      body = {
        summary: rdv.titre,
        location: rdv.lieu || "",
        start: { date: rdv.date },
        end: { date: isoDate(endDate) },
        reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 12 * 60 }] }
      };
    }
    return driveFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (ev) { return ev.id || null; }).catch(function () { return null; });
  }

  function deleteCalendarEvent(eventId) {
    if (!google_.accessToken || !eventId) return Promise.resolve();
    return driveFetch("https://www.googleapis.com/calendar/v3/calendars/primary/events/" + eventId, { method: "DELETE" }).catch(function () {});
  }

  function ensurePicker() {
    if (google_.pickerLoaded) return Promise.resolve();
    return new Promise(function (resolve) {
      gapi.load("picker", { callback: function () { google_.pickerLoaded = true; resolve(); } });
    });
  }

  function openPicker() {
    ensurePicker().then(function () {
      var view = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes("application/json");
      var picker = new google.picker.PickerBuilder()
        .setOAuthToken(google_.accessToken)
        .setDeveloperKey(GOOGLE_API_KEY)
        .addView(view)
        .setCallback(function (data) {
          if (data.action === google.picker.Action.PICKED) {
            var fileId = data.docs[0].id;
            ui.driveFileId = fileId;
            try { localStorage.setItem("carnet-maison-drive-file-id", fileId); } catch (e) {}
            loadFromDrive(fileId);
          }
        })
        .build();
      picker.setVisible(true);
    });
  }

  function onTokenResponse(resp) {
    if (resp.error) {
      if (google_.silentAttempted) { google_.silentAttempted = false; return; }
      ui.driveStatus = "Connexion refusée"; render(); return;
    }
    google_.accessToken = resp.access_token;
    ui.signedIn = true;
    if (ui.driveFileId) loadFromDrive(ui.driveFileId);
    render();
  }

  function requestTokenSilently() {
    if (!google_.tokenClient) return;
    google_.silentAttempted = true;
    google_.tokenClient.requestAccessToken({ prompt: "" });
  }

  function initGoogleAuth() {
    if (GOOGLE_CLIENT_ID.indexOf("REMPLACE_PAR") === 0) return; // pas encore configuré
    try {
      google_.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: onTokenResponse
      });
      ui.googleAvailable = true;
      render();
      // Reconnexion automatique et silencieuse si on s'était déjà connecté sur cet appareil
      if (ui.driveFileId) requestTokenSilently();
      setInterval(function () {
        if (document.visibilityState === "visible" && ui.driveFileId && google_.accessToken) {
          loadFromDrive(ui.driveFileId, true);
        }
      }, 20000);
      // Le jeton Google expire après ~1h : on le renouvelle discrètement avant ça
      setInterval(function () {
        if (ui.signedIn) requestTokenSilently();
      }, 45 * 60 * 1000);
    } catch (e) {}
  }

  Promise.all([
    loadScriptOnce("https://accounts.google.com/gsi/client"),
    loadScriptOnce("https://apis.google.com/js/api.js")
  ]).then(initGoogleAuth).catch(function () { /* Google indisponible sur ce domaine (normal sur claude.ai) */ });

  document.addEventListener("click", function (e) {
    if (e.target.closest('[data-action="google-signin"]')) {
      if (google_.tokenClient) google_.tokenClient.requestAccessToken();
      return;
    }
    if (e.target.closest('[data-action="google-signout"]')) {
      if (google_.accessToken && window.google) google.accounts.oauth2.revoke(google_.accessToken, function () {});
      google_.accessToken = null;
      ui.signedIn = false; ui.driveFileId = null;
      try { localStorage.removeItem("carnet-maison-drive-file-id"); } catch (err) {}
      render(); return;
    }
    if (e.target.closest('[data-action="drive-create"]')) { createDriveFile(); return; }
    if (e.target.closest('[data-action="drive-choose"]')) { openPicker(); return; }
    if (e.target.closest('[data-action="drive-share"]')) { openSharePage(); return; }
  });

  // ---------- Event handling ----------

  document.addEventListener("click", function (e) {
    var tabBtn = e.target.closest('[data-action="set-tab"]');
    if (tabBtn) { ui.tab = tabBtn.getAttribute("data-tab"); ui.quickAddOpen = false; ui.moreMenuOpen = false; render(); return; }

    var toggleMore = e.target.closest('[data-action="toggle-more"]');
    if (toggleMore) { ui.moreMenuOpen = !ui.moreMenuOpen; render(); return; }
    var closeMore = e.target.closest('[data-action="close-more"]');
    if (closeMore) { ui.moreMenuOpen = false; render(); return; }
    var exportBtn = e.target.closest('[data-action="export-data"]');
    if (exportBtn) { ui.moreMenuOpen = false; exportData(); render(); return; }

    var toggleQuickAdd = e.target.closest('[data-action="toggle-quickadd"]');
    if (toggleQuickAdd) { ui.quickAddOpen = !ui.quickAddOpen; render(); return; }
    var closeQuickAdd = e.target.closest('[data-action="close-quickadd"]');
    if (closeQuickAdd) { ui.quickAddOpen = false; render(); return; }
    var quickAddGoto = e.target.closest('[data-action="quickadd-goto"]');
    if (quickAddGoto) {
      ui.tab = quickAddGoto.getAttribute("data-tab");
      ui.quickAddOpen = false;
      ui.focusAddForm = true;
      render(); return;
    }

    var delRdv = e.target.closest('[data-action="del-rdv"]');
    if (delRdv) {
      var rdvId = delRdv.getAttribute("data-id");
      var removed = state.rdvs.filter(function (r) { return r.id === rdvId; })[0];
      state.rdvs = state.rdvs.filter(function (r) { return r.id !== rdvId; });
      render(); persist();
      if (removed && removed.calendarEventId) deleteCalendarEvent(removed.calendarEventId);
      return;
    }

    var delCourse = e.target.closest('[data-action="del-course"]');
    if (delCourse) {
      state.courses = state.courses.filter(function (c) { return c.id !== delCourse.getAttribute("data-id"); });
      render(); persist(); return;
    }

    var delTache = e.target.closest('[data-action="del-tache"]');
    if (delTache) {
      state.taches = state.taches.filter(function (x) { return x.id !== delTache.getAttribute("data-id"); });
      render(); persist(); return;
    }

    var delNote = e.target.closest('[data-action="del-note"]');
    if (delNote) {
      state.notes = state.notes.filter(function (n) { return n.id !== delNote.getAttribute("data-id"); });
      render(); persist(); return;
    }

    var delDepense = e.target.closest('[data-action="del-depense"]');
    if (delDepense) {
      state.depenses = state.depenses.filter(function (d) { return d.id !== delDepense.getAttribute("data-id"); });
      render(); persist(); return;
    }

    var delEnfant = e.target.closest('[data-action="del-enfant"]');
    if (delEnfant) {
      state.enfants = state.enfants.filter(function (en) { return en.id !== delEnfant.getAttribute("data-id"); });
      render(); persist(); return;
    }

    var delPhoto = e.target.closest('[data-action="del-enfant-photo"]');
    if (delPhoto) {
      var enIdDel = delPhoto.getAttribute("data-id");
      state.enfants.forEach(function (en) { if (en.id === enIdDel) en.photo = ""; });
      render(); persist(); return;
    }

    var budgetPrev = e.target.closest('[data-action="budget-prev"]');
    if (budgetPrev) { ui.budgetMonthOffset -= 1; render(); return; }
    var budgetNext = e.target.closest('[data-action="budget-next"]');
    if (budgetNext) { ui.budgetMonthOffset += 1; render(); return; }

    var quickAdd = e.target.closest('[data-action="quick-add-course"]');
    if (quickAdd) {
      addCourseItem(quickAdd.getAttribute("data-texte"), quickAdd.getAttribute("data-categorie"));
      render(); persist(); return;
    }

    var printRepas = e.target.closest('[data-action="print-repas"]');
    if (printRepas) { window.print(); return; }

    var toggleIdeas = e.target.closest('[data-action="toggle-ideas"]');
    if (toggleIdeas) { ui.ideasOpen = !ui.ideasOpen; render(); return; }

    var repasToCourses = e.target.closest('[data-action="repas-to-courses"]');
    if (repasToCourses) {
      var weekStart = repasToCourses.getAttribute("data-week-start");
      var startDate = new Date(weekStart + "T00:00:00");
      for (var wi = 0; wi < 7; wi++) {
        var wd = new Date(startDate); wd.setDate(wd.getDate() + wi);
        var wEntry = state.repas[isoDate(wd)] || {};
        [wEntry.midi, wEntry.soir].forEach(function (meal) {
          if (!meal) return;
          meal.split(",").forEach(function (part) {
            if (part.trim()) addCourseItem(part, "Épicerie");
          });
        });
      }
      render(); persist(); return;
    }

    var clearBought = e.target.closest('[data-action="clear-bought"]');
    if (clearBought) {
      state.courses = state.courses.filter(function (c) { return !c.achete; });
      render(); persist(); return;
    }

    var wkPrev = e.target.closest('[data-action="week-prev"]');
    if (wkPrev) { ui.weekOffset -= 1; render(); return; }
    var wkNext = e.target.closest('[data-action="week-next"]');
    if (wkNext) { ui.weekOffset += 1; render(); return; }

    var calSelect = e.target.closest('[data-action="cal-select"]');
    if (calSelect) {
      var d = calSelect.getAttribute("data-date");
      ui.selectedDate = (ui.selectedDate === d) ? null : d;
      render(); return;
    }
    var calPrev = e.target.closest('[data-action="cal-prev"]');
    if (calPrev) { ui.calMonthOffset -= 1; render(); return; }
    var calNext = e.target.closest('[data-action="cal-next"]');
    if (calNext) { ui.calMonthOffset += 1; render(); return; }
    var calClear = e.target.closest('[data-action="cal-clear"]');
    if (calClear) { ui.selectedDate = null; render(); return; }
  });

  document.addEventListener("input", function (e) {
    var si = e.target.closest("#search-input");
    if (si) { ui.searchQuery = si.value; render(); }
  });

  document.addEventListener("change", function (e) {
    var toggleCourse = e.target.closest('[data-action="toggle-course"]');
    if (toggleCourse) {
      var cId = toggleCourse.getAttribute("data-id");
      state.courses.forEach(function (c) { if (c.id === cId) c.achete = toggleCourse.checked; });
      render(); persist(); return;
    }
    var toggleTache = e.target.closest('[data-action="toggle-tache"]');
    if (toggleTache) {
      var tId = toggleTache.getAttribute("data-id");
      state.taches.forEach(function (x) { if (x.id === tId) x.fait = toggleTache.checked; });
      render(); persist(); return;
    }
    var editNaissance = e.target.closest('[data-action="edit-enfant-naissance"]');
    if (editNaissance) {
      var enId = editNaissance.getAttribute("data-id");
      state.enfants.forEach(function (en) { if (en.id === enId) en.naissance = editNaissance.value; });
      render(); persist(); return;
    }
    var editPhoto = e.target.closest('[data-action="edit-enfant-photo"]');
    if (editPhoto) {
      var file = editPhoto.files && editPhoto.files[0];
      if (!file) return;
      var enIdPhoto = editPhoto.getAttribute("data-id");
      resizeImageFile(file).then(function (dataUrl) {
        state.enfants.forEach(function (en) { if (en.id === enIdPhoto) en.photo = dataUrl; });
        render(); persist();
      }).catch(function () {});
      return;
    }
  });

  document.addEventListener("focusout", function (e) {
    var ta = e.target.closest('[data-action="edit-repas"]');
    if (ta) {
      var date = ta.getAttribute("data-date");
      var slot = ta.getAttribute("data-slot");
      if (!state.repas[date]) state.repas[date] = {};
      var val = ta.value;
      if (state.repas[date][slot] !== val) {
        state.repas[date][slot] = val;
        persist();
      }
    }
    var enNotes = e.target.closest('[data-action="edit-enfant-notes"]');
    if (enNotes) {
      var enId2 = enNotes.getAttribute("data-id");
      var val2 = enNotes.value;
      var changed = false;
      state.enfants.forEach(function (en) { if (en.id === enId2 && en.notes !== val2) { en.notes = val2; changed = true; } });
      if (changed) persist();
    }
  });

  document.addEventListener("submit", function (e) {
    var addRdv = e.target.closest('[data-action="add-rdv"]');
    if (addRdv) {
      e.preventDefault();
      var fd = new FormData(addRdv);
      var newRdv = { id: newId(), titre: fd.get("titre").trim(), date: fd.get("date"), heure: fd.get("heure") || "", lieu: (fd.get("lieu") || "").trim(), enfant: fd.get("enfant") || "", calendarEventId: null };
      state.rdvs.push(newRdv);
      render(); persist();
      createCalendarEvent(newRdv).then(function (eventId) {
        if (eventId) { newRdv.calendarEventId = eventId; persist(); }
      });
      return;
    }
    var addCourse = e.target.closest('[data-action="add-course"]');
    if (addCourse) {
      e.preventDefault();
      var fd2 = new FormData(addCourse);
      addCourseItem(fd2.get("texte"), fd2.get("categorie"), fd2.get("assignee"));
      render(); persist(); return;
    }
    var addTache = e.target.closest('[data-action="add-tache"]');
    if (addTache) {
      e.preventDefault();
      var fd3 = new FormData(addTache);
      var txt3 = fd3.get("texte").trim();
      if (txt3) state.taches.push({ id: newId(), texte: txt3, fait: false, recurrente: !!fd3.get("recurrente"), assignee: fd3.get("assignee") || "" });
      render(); persist(); return;
    }
    var addNote = e.target.closest('[data-action="add-note"]');
    if (addNote) {
      e.preventDefault();
      var fd4 = new FormData(addNote);
      var txt4 = fd4.get("texte").trim();
      if (txt4) state.notes.push({ id: newId(), texte: txt4 });
      render(); persist(); return;
    }
    var addDepense = e.target.closest('[data-action="add-depense"]');
    if (addDepense) {
      e.preventDefault();
      var fd5 = new FormData(addDepense);
      var libelle = fd5.get("libelle").trim();
      var montant = parseFloat(fd5.get("montant"));
      if (libelle && !isNaN(montant)) {
        state.depenses.push({ id: newId(), libelle: libelle, montant: montant, categorie: fd5.get("categorie"), date: fd5.get("date") || todayISO() });
      }
      render(); persist(); return;
    }
    var addEnfant = e.target.closest('[data-action="add-enfant"]');
    if (addEnfant) {
      e.preventDefault();
      var fd6 = new FormData(addEnfant);
      var prenom = fd6.get("prenom").trim();
      if (prenom) state.enfants.push({ id: newId(), prenom: prenom, naissance: fd6.get("naissance") || "", notes: "", photo: "" });
      render(); persist(); return;
    }
  });

  render();
})();
</script>
</body>
</html>
